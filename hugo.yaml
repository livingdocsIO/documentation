locale: en-us
theme: hugo-docs
uglyURLs: false
refLinksErrorLevel: ERROR
baseURL: https://docs.livingdocs.io/
title: Livingdocs Documentation
enableGitInfo: true
enableEmoji: true
enableInlineShortcodes: true
enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      unsafe: true

  highlight:
    codeFences: true
    guessSyntax: true
    hl_Lines: ''
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    tabWidth: 2

  tableOfContents:
    endLevel: 4
    ordered: false
    startLevel: 1

minify:
  tdewolff:
    html:
      keepWhitespace: false

services:
  googleAnalytics:
    id: GTM-K6QTH5K

imaging:
  quality: 80
  resampleFilter: Lanczos

# Files live next to the content that references them, but Hugo can only
# resolve them as assets. The extra mount exposes content/ under both roots.
module:
  mounts:
    - source: content
      target: content
    - source: data
      target: data
    - source: content
      target: assets

# Originals are never served, only their processed WebP variants, so publish
# resources on demand instead of copying every source image into public/.
cascade:
  - target: {}
    build:
      publishResources: false

disableKinds:
  - taxonomy
  - term

mediatypes:
  text/markdown+llms:
    delimiter: '.'
    suffixes: ['txt']

outputFormats:
  SearchIndex:
    baseName: search
    mediaType: application/json
  LLMS:
    baseName: 'llms'
    mediaType: text/markdown+llms
    isPlainText: true

outputs:
  home: [HTML, RSS, SearchIndex, LLMS]
  section: [HTML, LLMS]
  page: [HTML, LLMS]

params:
  branch: main

server:
  headers:
    - for: /openapi*.json
      values:
        Access-Control-Allow-Origin: '*'
