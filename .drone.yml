---
kind: pipeline
name: build

clone:
  depth: 5000

steps:
  - name: build
    image: livingdocs/docker-node:28-22
    volumes:
      - name: dockersocket
        path: /var/run/docker.sock
    settings:
      repo: livingdocs/docs

  - name: smoke-test
    image: livingdocs/docker-node:28-22
    volumes:
      - name: dockersocket
        path: /var/run/docker.sock
    commands:
      - ./bin/smoke-test.sh livingdocs/docs:sha-$DRONE_COMMIT_SHA

  - name: push
    image: livingdocs/docker-node:28-22
    volumes:
      - name: dockersocket
        path: /var/run/docker.sock
    environment:
      PLUGIN_REPO: livingdocs/docs
      DOCKER_USERNAME:
        from_secret: DOCKER_USERNAME
      DOCKER_PASSWORD:
        from_secret: DOCKER_PASSWORD
    commands:
      - docker-login
      - push-docker-sha

  - name: release
    image: livingdocs/semantic-release:v3.0.3
    environment:
      GH_TOKEN:
        from_secret: GH_TOKEN

volumes:
  - name: dockersocket
    host:
      path: /var/run/docker.sock

trigger:
  event: [push]

---
kind: pipeline
name: tag

steps:
  - name: tag
    image: livingdocs/docker-node:28-22
    environment:
      DOCKER_USERNAME:
        from_secret: DOCKER_USERNAME
      DOCKER_PASSWORD:
        from_secret: DOCKER_PASSWORD
    commands:
      - |
        docker-login
        SHA_TAG=livingdocs/docs:sha-$DRONE_COMMIT_SHA
        RELEASE_TAG=livingdocs/docs:$DRONE_TAG
        regctl image cp $SHA_TAG $RELEASE_TAG

trigger:
  event: [tag]

---
kind: signature
hmac: 9392c741b2194a664a6809bbe54ae57b90135d9bd90ccb6eef3cecccc9e7d96a

...
